services:

  mongo:
    image: mongo:7.0.17
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init:/init:ro
    networks:
      - gisd_net
    command: >
      bash -c "
      docker-entrypoint.sh mongod &
      sleep 5 &&
      /init/import.sh &&
      wait"


  kafka:
    image: bitnami/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmno1234567890
    networks:
      - gisd_net
    volumes:
      - kafka_data:/bitnami/kafka
      
  kafka-init:
    image: bitnami/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      - kafka
    networks:
      - gisd_net
    entrypoint: >
      bash -c '
        echo "Esperando a que Kafka esté disponible...";
        until kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
          sleep 2;
        done &&
        echo "Kafka disponible. Creando topics..." &&
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic flight-delay-ml-request &&
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic flight-delay-ml-response
      '
      
  flask:
    build: ./resources/web
    container_name: flask
    ports:
      - "5001:5001"
    environment:
      - PROJECT_HOME=/app
    depends_on:
      - kafka
      - mongo
    networks:
      - gisd_net

  spark-master:
    image: bitnami/spark:3.5.3
    container_name: spark-master
    depends_on:
      - kafka
      - mongo
    ports:
      - "7077:7077"
      - "8080:8080" # UI del master
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    networks:
      - gisd_net
    volumes:
      - ./flight_prediction:/flight_prediction
      - ./models:/app/models

  spark-worker-1:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # UI del worker 1
    environment:
      - SPARK_MODE=worker
      - "SPARK_MASTER_URL=spark://spark-master:7077"
      - HOME=/tmp
      - PYSPARK_PYTHON=python3
    networks:
      - gisd_net
    volumes:
      - ./flight_prediction:/flight_prediction
      - ./models:/app/models

  spark-worker-2:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081" # UI del worker 2 (mapea 8082 del host a 8081 del contenedor)
    environment:
      - SPARK_MODE=worker
      - "SPARK_MASTER_URL=spark://spark-master:7077"
      - HOME=/tmp
      - PYSPARK_PYTHON=python3
    networks:
      - gisd_net
    volumes:
      - ./flight_prediction:/flight_prediction
      - ./models:/app/models

  spark-submit:
    image: bitnami/spark:3.5.3
    container_name: spark-submit
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    ports:
      - "4040:4040" # UI del driver Spark
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
      - "constraint:node==spark-master"
      - PYSPARK_PYTHON=python3       
      - HOME=/tmp
    command: >
      bash -c "sleep 30 &&
      spark-submit
      --master spark://spark-master:7077 \
      --conf spark.jars.ivy=/tmp/.ivy2 \
      --packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,com.datastax.spark:spark-cassandra-connector_2.12:3.4.1 \
      --class es.upm.dit.ging.predictor.MakePrediction \
      /flight_prediction/target/scala-2.12/flight_prediction_2.12-0.1.jar"
    volumes:
      - ./flight_prediction:/flight_prediction
      - ./models:/app/models
    networks:
      - gisd_net

  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=098765432100
      - NIFI_WEB_HTTP_PORT=8443
    ports:
      - "8443:8443"
      - "5050:5050"
    networks:
      - gisd_net
    volumes:
      - ./nifi_data:/nifi-output
    

  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    environment:
      - CLUSTER_NAME=hadoop
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - CORE_CONF_fs_defaults=hdfs://hadoop-namenode:8020
    ports:
      - "9870:9870"  # Interfaz web del NameNode
      - "8020:8020"
    networks:
      - gisd_net
    volumes:
      - hadoop-namenode:/hadoop/dfs/name

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_CONF_dfs_webhdfs_enabled=true
    networks:
      - gisd_net
    volumes:
      - hadoop-datanode:/hadoop/dfs/data
    
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    networks:
      - gisd_net
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=distancias-cluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch

  cassandra-migrator:
    build:
      context: .
      dockerfile: docker/cassandra/Dockerfile
    container_name: cassandra-migrator
    depends_on:
      - cassandra
      - mongo
    networks:
      - gisd_net
    volumes:
      - ./data:/app/data
    command: >
      bash -c "
        echo 'Esperando a Cassandra...' &&
        until cqlsh cassandra 9042 -e 'DESC KEYSPACES'; do sleep 2; done &&
        echo 'Cassandra lista, esperando 10s...' &&
        sleep 10 &&
        python3 /app/data/migration_cassandra.py
      "

volumes:
  mongo_data:
  kafka_data:
  hadoop-datanode:
  hadoop-namenode:
  cassandra_data:


networks:
  gisd_net:
    name: gisd_net
    driver: bridge

